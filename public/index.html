<!doctype html>
<html lang="zh-CN" data-theme="wuxia-scroll">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>本地角色扮演 Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="工作台状态">
        <div>
          <h1>本地角色扮演 Agent</h1>
          <p id="app-status">正在载入本地状态...</p>
        </div>
        <label class="theme-switcher">
          <span>主题</span>
          <select id="theme-select" aria-label="主题">
            <option value="default-dark">极简暗黑</option>
            <option value="wuxia-scroll">武侠卷轴</option>
          </select>
        </label>
        <button id="refresh-state" class="ghost-button" type="button">刷新</button>
      </header>

      <main class="workspace">
        <aside class="panel provider-panel" aria-label="Provider 配置">
          <div class="panel-heading">
            <h2>接口配置</h2>
            <span id="provider-status" class="status-text">未保存</span>
          </div>

          <form id="provider-form" class="form-grid">
            <label>
              <span>Provider ID</span>
              <input id="provider-id" name="provider-id" autocomplete="off" placeholder="local">
            </label>
            <label>
              <span>Base URL</span>
              <input id="provider-base-url" name="provider-base-url" autocomplete="off" placeholder="https://api.example.com/v1">
            </label>
            <label>
              <span>API Key</span>
              <input id="provider-api-key" name="provider-api-key" type="password" autocomplete="off" placeholder="sk-...">
            </label>
            <label>
              <span>Model</span>
              <input id="provider-model" name="provider-model" autocomplete="off" placeholder="model-name">
            </label>
            <div class="split-row">
              <label>
                <span>Temperature</span>
                <input id="provider-temperature" name="provider-temperature" type="number" min="0" max="2" step="0.1" value="0.9">
              </label>
              <label>
                <span>Max Tokens</span>
                <input id="provider-max-tokens" name="provider-max-tokens" type="number" min="1" step="1" value="2000">
              </label>
            </div>
            <label>
              <span>Headers JSON</span>
              <textarea id="provider-headers" name="provider-headers" spellcheck="false" rows="5">{}</textarea>
            </label>
            <button id="save-provider" class="primary-button" type="submit">保存接口</button>
          </form>
        </aside>

        <section class="panel chat-panel" aria-label="对话工作区">
          <div class="panel-heading">
            <div>
              <h2>叙事会话</h2>
              <span id="session-status" class="status-text">等待状态</span>
            </div>
          </div>

          <div id="messages" class="messages" aria-live="polite"></div>

          <div class="stage-actions" role="group" aria-label="场景操作">
            <button class="tool-button" type="button" data-tab-shortcut="character">角色设定</button>
            <button class="tool-button" type="button" data-action-template="请修复上一轮回复的格式，保持剧情不倒退。">修复格式</button>
            <button class="tool-button" type="button" data-scroll-bottom>回到底部</button>
          </div>

          <form id="chat-form" class="chat-form">
            <textarea id="chat-input" rows="3" placeholder="输入角色行动或旁白指令..." spellcheck="false"></textarea>
            <button class="primary-button" type="submit">发送</button>
          </form>
        </section>

        <aside class="panel inspector-panel" aria-label="检查器">
          <div class="panel-heading">
            <h2>检查器</h2>
          </div>

          <div class="tabs" role="tablist" aria-label="检查器标签">
            <button class="tab-button active" type="button" data-tab="memory" role="tab" aria-selected="true">记忆</button>
            <button class="tab-button" type="button" data-tab="facts" role="tab" aria-selected="false">事实</button>
            <button class="tab-button" type="button" data-tab="worldbook" role="tab" aria-selected="false">世界书</button>
            <button class="tab-button" type="button" data-tab="character" role="tab" aria-selected="false">角色卡</button>
            <button class="tab-button" type="button" data-tab="prompt" role="tab" aria-selected="false">Prompt</button>
          </div>

          <section class="tab-pane active" data-pane="memory" role="tabpanel">
            <pre id="memory-view" class="json-view"></pre>
          </section>

          <section class="tab-pane" data-pane="facts" role="tabpanel" hidden>
            <div id="fact-list" class="fact-list"></div>
            <div class="editor-actions">
              <span id="fact-status" class="status-text"></span>
              <button id="add-fact" class="ghost-button compact" type="button">新增事实</button>
              <button id="save-facts" class="primary-button compact" type="button">保存事实</button>
            </div>
          </section>

          <section class="tab-pane" data-pane="worldbook" role="tabpanel" hidden>
            <textarea id="worldbook-editor" class="json-editor" spellcheck="false"></textarea>
            <div class="editor-actions">
              <span id="worldbook-status" class="status-text"></span>
              <button id="add-worldbook-entry" class="ghost-button compact" type="button">新增条目</button>
              <button id="save-worldbook" class="primary-button compact" type="button">保存世界书</button>
            </div>
          </section>

          <section class="tab-pane" data-pane="character" role="tabpanel" hidden>
            <div class="file-row">
              <input id="character-card-import" type="file" accept=".json,.png,application/json,image/png">
            </div>
            <textarea id="character-card-editor" class="json-editor" spellcheck="false"></textarea>
            <div class="editor-actions">
              <span id="character-card-status" class="status-text"></span>
              <button id="reset-character-card" class="ghost-button compact" type="button">角色模板</button>
              <button id="save-character-card" class="primary-button compact" type="button">保存角色卡</button>
            </div>
          </section>

          <section class="tab-pane" data-pane="prompt" role="tabpanel" hidden>
            <textarea id="prompt-editor" class="json-editor" spellcheck="false"></textarea>
            <div class="editor-actions">
              <span id="prompt-status" class="status-text"></span>
              <button id="save-prompt" class="primary-button compact" type="button">保存 Prompt</button>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
